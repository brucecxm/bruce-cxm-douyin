

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:10086/eureka

# Spring Boot Admin 客户端配置
spring:
  boot:
    admin:
      client:
        url: http://localhost:8080  # Admin 服务端地址

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: "*"  # 暴露所有 Actuator 端点
  endpoint:
    health:
      show-details: always  # 总是显示健康状态详情