spring:
  application:
    name: api-gateway
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB # 单个文件最大大小
      max-request-size: 100MB # 整个请求最大大小
  # redis配置

  cloud:
    gateway:
      routes:
        - id: DouyinUserService
          uri: lb://DouyinUserService
          predicates:
            - Path=/user/**
        - id: DouyinAdminService
          uri: lb://DouyinAdminService
          predicates:
            - Path=/admin/**
        - id: DouyinTestService
          uri: lb://DouyinTestService
          predicates:
            - Path=/test/**
        - id: DouyinChatService
          uri: lb://DouyinChatService
          predicates:
            - Path=/chat/**
        - id: DouyinShopService
          uri: lb://DouyinShopService
          predicates:
            - Path=/shop/**
        - id: DouyinVideoService
          uri: lb://DouyinVideoService
          predicates:
            - Path=/video/**,/music/**,/comment/**
        - id: DouyinApiServer
          uri: lb://API-SERVER
          predicates:
            - Path=/newshop/**
          filters:
            - RewritePath=/newshop/(?<segment>.*), /${segment}
        - id: DouyinCommonService
          uri: lb://DouyinCommonService
          predicates:
            - Path=/common/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# redis配置
redis:
  # Redis数据库索引（默认为0）
  database: 12
  # Redis服务器地址
  host: 1.94.131.16
  # Redis服务器连接端口
  port: 6379
  # Redis服务器连接密码（默认为空）
  password: Aa.147258
  # 连接超时时间
  timeout: 10s
  lettuce:
    pool:
      # 连接池最大连接数
      max-active: 200
      # 连接池最大阻塞等待时间（使用负值表示没有限制）
      max-wait: -1ms
      # 连接池中的最大空闲连接
      max-idle: 10
      # 连接池中的最小空闲连接
      min-idle: 0

eureka:
  client:
    service-url:
      defaultZone: http://1.94.131.16:8080/eureka # Eureka服务器地址
