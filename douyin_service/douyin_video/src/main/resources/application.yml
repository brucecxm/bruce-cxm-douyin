spring:
  profiles:
    active: dev # 生产环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    client:
      hostname: localhost  # 强制注册主机名为localhost
    inetutils:
      preferred-networks: 127.0.0.1 # 优先使用本机回环地址

eureka:
  instance:
    prefer-ip-address: true # 微服务注册时，优先使用IP地址，而不是主机名
    instance-id: ${spring.cloud.client.ip-address}:${server.port} # 自定义实例ID为「IP:端口」，彻底告别随机字符串ID

server:
  port: 9573

upload:
  temp.dir: /tmp/upload_chunks # 临时分片存储目录

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

logging:
  level:
    root: info
    jdbc: debug
    jdbc.sqlonly: debug
    jdbc.sqltiming: debug
    jdbc.audit: debug
    jdbc.resultset: debug
    jdbc.connection: debug
    com.example.mapper: debug # 替换成你的 Mapper 包路径

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

agora:
  appId: your_real_agora_app_id
  appCertificate: your_real_agora_app_certificate # 如果你还有这个字段
