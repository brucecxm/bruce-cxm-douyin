spring:
  servlet:
    multipart:
      max-file-size: 10GB # 允许大文件
      max-request-size: 10GB

  redis:
    # Redis数据库索引（默认为0）
    database: 12
    # Redis服务器地址
    host: 1.94.131.16
    # Redis服务器连接端口
    port: 6379
    password: Aa.147258
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0

  rabbitmq:
    host: 1.94.131.16
    port: 5672
    username: itcast
    password: 123321
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
#        acknowledge-mode: manual
        prefetch: 100
  application:
    name: DouyinVideoService
  datasource:
    # 显式指定Druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    username: remote_user
    password: bruce_CXM_123
    url: jdbc:mysql://1.94.131.16:3306/douyintest?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false
    # Druid专属配置
    druid:
      initial-size: 5 # 初始连接数
      max-active: 20 # 最大连接数
      min-idle: 5 # 最小空闲连接数
      max-wait: 60000 # 获取连接的最大等待时间（毫秒）
      # 可选：配置监控、过滤等功能
      filters: stat,wall,slf4j # 统计、防SQL注入、日志过滤器
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        login-username: admin # 监控页登录用户名
        login-password: admin # 监控页登录密码
        allow: 0.0.0.0 # 允许所有IP访问（或留空：allow:）

