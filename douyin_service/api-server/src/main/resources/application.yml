spring:
  application:
    name: api-server # 服务名称
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  cloud:
    client:
      hostname: localhost # 强制注册主机名为localhost
    inetutils:
      preferred-networks: 127.0.0.1 # 优先使用本机回环地址
  redis:
    # Redis数据库索引（默认为0）
    database: 12
    # Redis服务器地址
    host: 1.94.131.16
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    password: Aa.147258
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0

  rabbitmq:
    host: 1.94.131.16 # RabbitMQ 服务器的主机地址
    port: 5672 # RabbitMQ 服务器的端口号
    username: itcast # RabbitMQ 的用户名
    password: 123321 # RabbitMQ 的密码
    virtual-host: / # RabbitMQ 的虚拟主机
    connection - timeout: 5000 # 设置连接超时时间为5秒，可调整
    template:
      retry:
        enabled: true # 开启超时重试机制
        initial - interval: 5000ms # 失败后的初始等待时间为5秒，可调整
        multiplier: 1 # 失败后下次等待时长倍数，下次等待时长 = initial - interval * multiplier
        max - attempts: 3 # 最大重试次数为3次，可调整

  datasource:
    url: jdbc:mysql://1.94.131.16:3306/vue_multi_page?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&characterSetResults=utf8&allowPublicKeyRetrieval=true
    username: remote_user
    password: bruce_CXM_123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        useUnicode: true
        characterEncoding: utf8
        characterSetResults: utf8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        connection.characterEncoding: utf8
        connection.useUnicode: true
        connection.charSet: utf8
        jdbc.batch_size: 50
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
  messages:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 热加载配置
  devtools:
    restart:
      enabled: true
      # 重启排除目录
      exclude: static/**,public/**,resources/**
      # 触发重启的额外目录
      additional-paths: src/main/java
    livereload:
      enabled: true
  thymeleaf:
    cache: false
  freemarker:
    cache: false
  groovy:
    template:
      cache: false

eureka:
  instance:
    prefer-ip-address: true # 微服务注册时，优先使用IP地址，而不是主机名
    instance-id: ${spring.cloud.client.ip-address}:${server.port} # 自定义实例ID为「IP:端口」，彻底告别随机字符串ID
  client:
    service-url:
      defaultZone: http://1.94.131.16:8080/eureka # Eureka服务器地址

server:
  port: 7400

logging:
  level:
    com.example.apiserver: debug
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: your-secret-key-change-in-production
  expiration: 86400000

# MinIO配置
minio:
  accessKey: minio
  secretKey: minio123
  bucket: douyin
  endpoint: http://1.94.131.16:9000
  readPath: http://1.94.131.16:9000
