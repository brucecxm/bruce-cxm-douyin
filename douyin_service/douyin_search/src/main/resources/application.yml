
spring:
  application:
    name: DouyinSearchService
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/douyintest?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
  data:
    mongodb:
      host: localhost
      port: 27017
      database: onetest
  cloud:
    client:
      hostname: localhost  # 强制注册主机名为localhost
    inetutils:
      preferred-networks: 127.0.0.1 # 优先使用本机回环地址


server:
  port: 9009
eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:10086/eureka
  instance:
    prefer-ip-address: true # 微服务注册时，优先使用IP地址，而不是主机名
    instance-id: ${spring.cloud.client.ip-address}:${server.port} # 自定义实例ID为「IP:端口」，彻底告别随机字符串ID