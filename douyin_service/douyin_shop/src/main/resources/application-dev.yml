spring:

  rabbitmq:
    host: 1.94.131.16  # RabbitMQ 服务器的主机地址
    port: 5672  # RabbitMQ 服务器的端口号
    username: itcast  # RabbitMQ 的用户名
    password: 123321  # RabbitMQ 的密码
    virtual-host: /  # RabbitMQ 的虚拟主机
    connection - timeout: 5000 # 设置连接超时时间为5秒，可根据需求调整
    template:
      retry:
        enabled: true # 开启超时重试机制
        initial - interval: 5000ms # 失败后的初始等待时间为5秒，可调整
        multiplier: 1 # 失败后下次等待时长倍数，下次等待时长 = initial - interval * multiplier
        max - attempts: 3 # 最大重试次数为3次，可调整


  application:
    #应用的名称，可选
    name: DouyinShopService
  # redis配置
  redis:
    # Redis数据库索引（默认为0）
    database: 12
    # Redis服务器地址
    host: 1.94.131.16
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    # password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0

  datasource:
    # 显式指定Druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    username: remote_user
    password: bruce_CXM_123
    url: jdbc:mysql://1.94.131.16:3306/douyintest?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false
    # Druid专属配置
    druid:
      initial-size: 500        # 初始连接数
      max-active: 2000         # 最大连接数
      min-idle: 500            # 最小空闲连接数
      max-wait: 6000000        # 获取连接的最大等待时间（毫秒）
      # 可选：配置监控、过滤等功能
      filters: stat,wall,slf4j  # 统计、防SQL注入、日志过滤器
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        login-username: admin  # 监控页登录用户名
        login-password: admin  # 监控页登录密码




# Sa-Token 配置
sa-token:
  # SSO-相关配置
  sso-client:
    # SSO-Server端主机地址
    server-url: http://1.94.131.16:8988

eureka:
  client:
    service-url:
      defaultZone: http://1.94.131.16:8080/eureka # Eureka 服务注册中心的地址

minio:
  accessKey: minio
  secretKey: minio123
  bucket: leadnews
  endpoint: http://1.94.131.16:9000
  readPath: http://1.94.131.16:9000
