spring:
  rabbitmq:
    host: 1.94.131.16.130 # RabbitMQ 服务器的主机地址
    port: 5672 # RabbitMQ 服务器的端口号
    username: itcast # RabbitMQ 的用户名
    password: 123321 # RabbitMQ 的密码
    virtual-host: / # RabbitMQ 的虚拟主机

  application:
    #应用的名称，可选
    name: DouyinShopService

  datasource:
    # 显式指定Druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    username: remote_user
    password: bruce_CXM_123
    url: jdbc:mysql://1.94.131.16:3306/douyintest?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false
    # Druid专属配置
    druid:
      initial-size: 5        # 初始连接数
      max-active: 20         # 最大连接数
      min-idle: 5            # 最小空闲连接数
      max-wait: 60000        # 获取连接的最大等待时间（毫秒）
      # 可选：配置监控、过滤等功能
      filters: stat,wall,slf4j  # 统计、防SQL注入、日志过滤器
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        login-username: admin  # 监控页登录用户名
        login-password: admin  # 监控页登录密码

# Sa-Token 配置
sa-token:
  # SSO-相关配置
  sso-client:
    # SSO-Server端主机地址
    server-url: http://1.94.131.16:8988

  # 配置 Sa-Token 单独使用的Redis连接 （此处需要和SSO-Server端连接同一个Redis）
  alone-redis:
    # Redis数据库索引
    database: 1
    # Redis服务器地址
    host: 1.94.131.16
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    password:
    # 连接超时时间
    timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: http://1.94.131.16:8080/eureka # Eureka 服务注册中心的地址

minio:
  accessKey: minio
  secretKey: minio123
  bucket: leadnews
  endpoint: http://1.94.131.16:9000
  readPath: http://1.94.131.16:9000
