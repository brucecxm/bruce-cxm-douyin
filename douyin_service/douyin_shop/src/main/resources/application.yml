
spring:
  profiles:
    active: dev  # 生产环境
  cloud:
    client:
      hostname: localhost  # 强制注册主机名为localhost
    inetutils:
      preferred-networks: 127.0.0.1 # 优先使用本机回环地址

  tomcat:
    # 最大工作线程数，默认值为 200。这是核心配置
    max-threads: 200
    # 最小工作线程数，默认值为 10
    min-spare-threads: 10
    # 等待队列的最大长度，默认值为 100
    accept-count: 100
    # 最大连接数，默认值为 10000
    max-connections: 10000

eureka:
  instance:
    prefer-ip-address: true # 微服务注册时，优先使用IP地址，而不是主机名
    instance-id: ${spring.cloud.client.ip-address}:${server.port} # 自定义实例ID为「IP:端口」，彻底告别随机字符串ID
server:
  port: 7426


logging:
  level:
    org.mybatis: DEBUG     # 打印 MyBatis 执行的 SQL
    java.sql: DEBUG        # 打印 JDBC 执行的 SQL（包括参数）
    jdbc.sqlonly: DEBUG    # 打印 SQL 查询语句
    jdbc.resultset: DEBUG  # 打印 JDBC 查询结果集
    jdbc.statement: DEBUG  # 打印 JDBC 执行的语句
    org.springframework.amqp: OFF
    com.rabbitmq: OFF


mybatis:
  mapper-locations: classpath:mapper/**/*.xml

mybatis-plus:
  configuration:
    #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
reggie:
  path: D:\img\




############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

