server:
  port: 7456  # 设置应用的端口号为7456
  tomcat:
    # 最大连接数：服务器在任何给定时间可以处理的最大连接数
    max-connections: 10000
    # 最大线程数：Tomcat可以同时处理的请求数
    max-threads: 200
    # 最小备用线程数：Tomcat启动时创建的线程数
    min-spare-threads: 25
    # 连接超时时间（毫秒）：连接在被关闭之前可以保持空闲的时间
    connection-timeout: 20000
    # 接受队列大小：当所有线程都在使用时，等待处理的请求队列大小
    accept-count: 100
    # 最大HTTP头大小（字节）：限制HTTP请求头的大小，防止头部攻击
    max-http-header-size: 8192
    # 最大HTTP表单POST大小（字节）：限制表单提交的大小
    max-http-post-size: 2097152
    # 启用连接超时：是否启用连接超时
    connection-timeout-enabled: true
    # 启用重试：是否在连接失败时重试
    connection-reuse-enabled: true
    # 保持连接的超时时间（毫秒）：在关闭连接之前，连接可以保持空闲的时间
    keep-alive-timeout: 60000
    # 最大保持连接请求数：在关闭连接之前，连接可以处理的最大请求数
    max-keep-alive-requests: 100


spring:
  profiles:
    active: dev  # 生产环境
  mvc:
    static-path-pattern: /files/**
  cloud:
    client:
      hostname: localhost  # 强制注册主机名为localhost
    inetutils:
      preferred-networks: 127.0.0.1 # 优先使用本机回环地址

eureka:
  instance:
    prefer-ip-address: true # 微服务注册时，优先使用IP地址，而不是主机名
    instance-id: ${spring.cloud.client.ip-address}:${server.port} # 自定义实例ID为「IP:端口」，彻底告别随机字符串ID








############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: false

logging:
  level:
    root: info
    jdbc: debug
    jdbc.sqlonly: debug
    jdbc.sqltiming: debug
    jdbc.audit: debug
    jdbc.resultset: debug
    jdbc.connection: debug
    com.bruce: debug
    org.mybatis: DEBUG
    java.sql: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


